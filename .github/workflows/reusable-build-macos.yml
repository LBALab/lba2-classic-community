name: Build macOS (reusable)

# Reusable build steps for the macOS target. Called by release-macos.yml
# (tag-triggered) and release-latest.yml (rolling pre-release). Produces a
# `dist/` directory with the DMG and uploads it as a workflow artifact
# named `<artifact-prefix>-<arch>`.
#
# See docs/RELEASING.md "Adding a new release target" for the recipe this
# file follows.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: >-
          Prefix for the upload-artifact name. Caller appends -<arch>.
          Tag releases pass "macOS" (default); release-latest passes
          "latest-macos" so its download-artifact pattern picks them up.
        type: string
        required: false
        default: macOS

jobs:
  build:
    name: "Build ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One universal binary (arm64 + x86_64), built on the Apple Silicon
        # runner: clang compiles both architectures in the same job. The
        # macos-13 (Intel) runners queued 30+ minutes per job, which is why
        # there is no separate Intel leg.
        include:
          - runs-on: macos-latest   # Apple Silicon, builds both architectures
            arch: universal
            preset: macos_universal
            osx-architectures: "arm64;x86_64"
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
        with:
          # Full history so cmake/git_version.cmake can detect a clean
          # vs dirty tree (release tags are clean; -dirty is suppressed).
          fetch-depth: 0

      - name: Install SDL3 (static build)
        # link: static builds the static archive our LBA2_LINK_STATIC=ON path
        # needs; find_package then resolves SDL3::SDL3-static, which the root
        # CMakeLists.txt selects explicitly.
        uses: ./.github/actions/setup-sdl3
        id: sdl
        with:
          link: static
          build-type: Release
          osx-architectures: ${{ matrix.osx-architectures }}

      - name: Configure (static-link release build)
        run: |
          cmake --preset ${{ matrix.preset }} \
                -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
                -DLBA2_LINK_STATIC=ON \
                -DLBA2_RELEASE_SYMBOLS=ON \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # macOS refuses to start a binary whose minimum version is newer than
      # the running OS, whatever Info.plist says. Check the binary itself:
      # every architecture is there, and each one needs no more than 11.0.
      - name: Check architectures and minimum macOS version
        env:
          ARCHS: ${{ matrix.osx-architectures }}
        run: |
          BIN="out/build/${{ matrix.preset }}/SOURCES/LBA2 Classic Community.app/Contents/MacOS/lba2cc"
          lipo -info "$BIN"
          vtool -show-build "$BIN"
          IFS=';' read -r -a want <<< "$ARCHS"
          for arch in "${want[@]}"; do
            minos=$(vtool -arch "$arch" -show-build "$BIN" | awk '$1 == "minos" { print $2 }')
            if [ "$minos" != "11.0" ]; then
              echo "::error::lba2cc ($arch) needs macOS ${minos:-?}, expected 11.0"
              exit 1
            fi
          done

      - name: Bundle DMG
        run: |
          BUILD_DIR=out/build/${{ matrix.preset }}
          VERSION=$(cat "$BUILD_DIR/VERSION.txt")
          mkdir -p dist
          bash scripts/packaging/bundle-macos.sh \
            --app "$BUILD_DIR/SOURCES/LBA2 Classic Community.app" \
            --version "$VERSION" \
            --arch ${{ matrix.arch }} \
            --build-dir "$BUILD_DIR" \
            --output-dir dist \
            --split-symbols

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}
          path: |
            dist
            !dist/*-symbols.tar.xz

      # Its own artifact, so it outlives the rolling release, which replaces its
      # assets on every push: scripts/dev/symbolize_crash.py --fetch finds it by the
      # commit in a crash block. A tag release also attaches it to the release.
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}-symbols
          path: dist/*-symbols.tar.xz
          if-no-files-found: error
          retention-days: 90

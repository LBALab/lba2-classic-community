name: Linux

# paths-ignore set: docs/asset-only changes don't need a full multi-platform
# build matrix to fire. Anything that can affect build/test output (source,
# CMake, scripts, workflow YAML itself) is NOT in the ignore list and still
# triggers the run. Mirrored in macos.yml, windows.yml, test.yml, and the
# push: branches:[main] trigger of release-latest.yml.
on:
  push:
    paths-ignore: &doc-paths
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.git-blame-ignore-revs'
      - 'cliff.toml'
  pull_request:
    paths-ignore: *doc-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@4ebea449684c989388fe6bcea0460e300d13a5ae # main @ 2025-12-20
        id: sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          build-type: ${{ env.BUILD_TYPE }}

      # UASM is not required for this job (game + host tests: discovery + console state). ASM equivalence uses test.yml + Docker.
      #
      # No CMake/ninja install step: the ubuntu-latest runner image ships
      # CMake 3.31 and Ninja 1.13, both well past the 3.23 floor in
      # CMakePresets.json. Fetching a newer pair on every run bought nothing
      # and put a third-party action plus a release download on the critical
      # path. The linux-tarball release job builds the same presets against
      # apt's older CMake, so this floor has cover.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DLBA2_BUILD_TESTS=ON \
            -DLBA2_BUILD_ASM_EQUIV_TESTS=OFF \
            --preset linux

      # The generated .desktop entry and AppStream metainfo are copied into the
      # AppDir verbatim, so validating them here validates what ships. Both are
      # gates for the AppImageHub catalog, and neither failure mode is visible
      # from a build that succeeds: an unregistered Categories= value just files
      # the launcher entry under the wrong menu, on the machines that have one.
      - name: Validate packaging metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          # Globbed rather than named so renaming LBA2_DESKTOP_ID or
          # LBA2_BUNDLE_IDENTIFIER doesn't quietly validate nothing.
          desktop-file-validate build/packaging/*.desktop
          appstreamcli validate --explain build/packaging/*.metainfo.xml

      - name: Build
        run: |
          cmake --build build --target lba2cc
          cmake --build build --target host_tests

      - name: Host tests
        run: cd build && ctest -L host_quick --output-on-failure

      - name: Verify Binary
        run: test -f build/SOURCES/lba2cc && echo "Build successful"

  # The same sources through a second front end. gcc and clang disagree about
  # enough C++98 corners that gcc accepting a change is not evidence clang will,
  # and the only other clang in the matrix is AppleClang on the macOS leg, where
  # a front-end break reads as a platform failure and gets diagnosed as one.
  # The linux_clang preset already existed for local warning comparisons;
  # nothing ran it.
  build-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@4ebea449684c989388fe6bcea0460e300d13a5ae # main @ 2025-12-20
        id: sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          build-type: ${{ env.BUILD_TYPE }}

      - name: Configure
        run: |
          cmake -S . -B build-clang \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DLBA2_BUILD_TESTS=ON \
            -DLBA2_BUILD_ASM_EQUIV_TESTS=OFF \
            --preset linux_clang

      - name: Build
        run: |
          cmake --build build-clang --target lba2cc
          cmake --build build-clang --target host_tests

      - name: Host tests
        run: cd build-clang && ctest -L host_quick --output-on-failure

      - name: Verify Binary
        run: test -f build-clang/SOURCES/lba2cc && echo "Clang build successful"

  # AddressSanitizer over the same host tests the build job runs. The suite was
  # already clean when this job was added, so it can only ever fail on something
  # new: a heap overflow, a use-after-free, or a leak introduced by a change.
  # That also makes it a host stand-in for Android MTE, which is what the
  # linux_sanitize preset was written for.
  #
  # host_tests only, not lba2cc. The build job already proves the game target
  # compiles, and nothing here can run it without retail data, so a second full
  # link buys no coverage. The tests themselves take about three seconds.
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@4ebea449684c989388fe6bcea0460e300d13a5ae # main @ 2025-12-20
        id: sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          build-type: ${{ env.BUILD_TYPE }}

      # No -DCMAKE_BUILD_TYPE here: the preset pins Debug, and passing Release
      # would strip the frame pointers ASan needs for a readable stack.
      - name: Configure
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DLBA2_BUILD_TESTS=ON \
            -DLBA2_BUILD_ASM_EQUIV_TESTS=OFF \
            --preset linux_sanitize

      - name: Build
        run: cmake --build build-asan --target host_tests

      - name: Host tests under AddressSanitizer
        run: cd build-asan && ctest -L host_quick --output-on-failure

  # The demo SKU compiles a different set of sources: ~60 #ifdef DEMO sites the
  # default build never touches. That is exactly how it silently stopped
  # compiling between 1997 and the LBA2_BUILD_DEMO option, so an edit to the
  # files it shares with retail (GAMEMENU, PERSO, SAVEGAME, OBJECT) can break it
  # against a green matrix.
  #
  # The host tests run here too. They need no game data, and several of them
  # assert against build-dependent values -- test_res_picker checks the picker
  # modals quote Directories_GetResMarker(), which the demo build changes. A
  # compile-only job stays green while those messages send a demo player after
  # a file no demo install has.
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@4ebea449684c989388fe6bcea0460e300d13a5ae # main @ 2025-12-20
        id: sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          build-type: ${{ env.BUILD_TYPE }}

      # No CMake/ninja install step, for the reason given on the build job.
      - name: Configure
        run: |
          cmake -S . -B build-demo \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DLBA2_BUILD_DEMO=ON \
            -DLBA2_BUILD_TESTS=ON \
            -DLBA2_BUILD_ASM_EQUIV_TESTS=OFF \
            --preset linux

      - name: Build
        run: |
          cmake --build build-demo --target lba2cc
          cmake --build build-demo --target host_tests

      - name: Host tests
        run: cd build-demo && ctest -L host_quick --output-on-failure

      - name: Verify Binary
        run: test -f build-demo/SOURCES/lba2cc && echo "Demo build successful"

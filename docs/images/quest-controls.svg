<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1620" viewBox="0 0 1920 1620">
  <style>
    text { font-family: "DejaVu Sans", "Liberation Sans", sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 16px; fill: #475569; }
    .label { font-size: 17px; font-weight: 700; fill: #111827; }
    .label-note { font-size: 14px; fill: #475569; }
    .card-title { font-size: 19px; font-weight: 700; fill: #111827; }
    .card-text { font-size: 15px; fill: #1f2937; }
    .letter { font-size: 18px; font-weight: 700; fill: #111827; }
    .footer { font-size: 14px; fill: #64748b; }
  </style>

  <!-- Background photograph supplied for the controller map -->
  <image href="quest3-controllers.jpg" x="0" y="0" width="1920" height="1080"/>

  <!-- Leader lines: white halo, then coloured line -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-width="5.5" opacity="0.85">
      <path d="M 330 48 L 540 100"/>
      <path d="M 330 155 L 525 175"/>
      <path d="M 330 205 L 530 190"/>
      <path d="M 330 305 L 455 290"/>
      <path d="M 330 365 L 760 280" stroke-dasharray="7 6"/>
      <path d="M 760 80 L 600 275"/>
      <path d="M 920 35 L 680 195"/>
      <path d="M 700 600 L 660 520"/>
      <path d="M 1590 48 L 1360 100"/>
      <path d="M 1590 155 L 1370 175"/>
      <path d="M 1590 205 L 1370 190"/>
      <path d="M 1590 305 L 1290 275"/>
      <path d="M 1590 365 L 1140 280" stroke-dasharray="7 6"/>
      <path d="M 1120 40 L 1210 195"/>
      <path d="M 1080 600 L 1230 520"/>
    </g>
    <g stroke-width="2.5">
      <path d="M 330 48 L 540 100" stroke="#c2410c"/>
      <path d="M 330 155 L 525 175" stroke="#0e7490"/>
      <path d="M 330 205 L 530 190" stroke="#0e7490"/>
      <path d="M 330 305 L 455 290" stroke="#7e22ce"/>
      <path d="M 330 365 L 760 280" stroke="#4338ca" stroke-dasharray="7 6"/>
      <path d="M 760 80 L 600 275" stroke="#15803d"/>
      <path d="M 920 35 L 680 195" stroke="#15803d"/>
      <path d="M 700 600 L 660 520" stroke="#7e22ce"/>
      <path d="M 1590 48 L 1360 100" stroke="#c2410c"/>
      <path d="M 1590 155 L 1370 175" stroke="#b45309"/>
      <path d="M 1590 205 L 1370 190" stroke="#b45309"/>
      <path d="M 1590 305 L 1290 275" stroke="#15803d"/>
      <path d="M 1590 365 L 1140 280" stroke="#4338ca" stroke-dasharray="7 6"/>
      <path d="M 1120 40 L 1210 195" stroke="#15803d"/>
      <path d="M 1080 600 L 1230 520" stroke="#7e22ce"/>
    </g>
  </g>

  <!-- Button endpoints -->
  <g>
    <circle cx="540" cy="100" r="6" fill="#c2410c"/>
    <circle cx="525" cy="175" r="6" fill="#0e7490"/>
    <circle cx="530" cy="190" r="6" fill="#0e7490"/>
    <circle cx="455" cy="290" r="6" fill="#7e22ce"/>
    <circle cx="760" cy="280" r="6" fill="#4338ca"/>
    <circle cx="600" cy="275" r="6" fill="#15803d"/>
    <circle cx="680" cy="195" r="6" fill="#15803d"/>
    <circle cx="660" cy="520" r="6" fill="#7e22ce"/>
    <circle cx="1360" cy="100" r="6" fill="#c2410c"/>
    <circle cx="1370" cy="175" r="6" fill="#b45309"/>
    <circle cx="1370" cy="190" r="6" fill="#b45309"/>
    <circle cx="1290" cy="275" r="6" fill="#15803d"/>
    <circle cx="1140" cy="280" r="6" fill="#4338ca"/>
    <circle cx="1210" cy="195" r="6" fill="#15803d"/>
    <circle cx="1230" cy="520" r="6" fill="#7e22ce"/>
  </g>

  <!-- Left outer labels -->
  <rect x="26" y="22" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="320" y="51" text-anchor="end" class="label" fill="#c2410c">LT <tspan fill="#111827">· Backward / spell modifier</tspan></text>

  <rect x="26" y="132" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="320" y="161" text-anchor="end" class="label" fill="#0e7490">L stick <tspan fill="#111827">· Move</tspan></text>

  <rect x="26" y="182" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="320" y="211" text-anchor="end" class="label" fill="#0e7490">L stick click <tspan fill="#111827">· Dodge</tspan></text>

  <rect x="26" y="282" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="320" y="311" text-anchor="end" class="label" fill="#7e22ce">Menu <tspan fill="#111827">· In-game menu</tspan></text>

  <rect x="26" y="336" width="310" height="66" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="320" y="362" text-anchor="end" class="label" fill="#4338ca">L thumbrest <tspan fill="#111827">· Interior zoom</tspan></text>
  <text x="320" y="386" text-anchor="end" class="label-note">Touch + right stick up/down</text>

  <!-- Left face buttons -->
  <rect x="538" y="56" width="224" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="750" y="85" text-anchor="end" class="label" fill="#15803d">X <tspan fill="#111827">· Inventory</tspan></text>

  <rect x="698" y="10" width="224" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="910" y="39" text-anchor="end" class="label" fill="#15803d">Y <tspan fill="#111827">· Holomap</tspan></text>

  <!-- Left grip -->
  <rect x="698" y="578" width="286" height="66" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="712" y="604" class="label" fill="#7e22ce">LG <tspan fill="#111827">· Behaviour menu</tspan></text>
  <text x="712" y="628" class="label-note">Hold to keep open</text>

  <!-- Right outer labels -->
  <rect x="1584" y="22" width="310" height="66" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1598" y="48" class="label" fill="#c2410c">RT <tspan fill="#111827">· Throw / use weapon</tspan></text>
  <text x="1598" y="72" class="label-note">First person: hold, release to throw</text>

  <rect x="1584" y="132" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1598" y="161" class="label" fill="#b45309">R stick <tspan fill="#111827">· Camera orbit / turn</tspan></text>

  <rect x="1584" y="182" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1598" y="211" class="label" fill="#b45309">R stick click <tspan fill="#111827">· Recentre</tspan></text>

  <rect x="1584" y="282" width="310" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1598" y="311" class="label" fill="#15803d">A <tspan fill="#111827">· Talk / search / use</tspan></text>

  <rect x="1584" y="336" width="310" height="66" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1598" y="362" class="label" fill="#4338ca">R thumbrest <tspan fill="#111827">· Cheat chord</tspan></text>
  <text x="1598" y="386" class="label-note">Touch + X / Y</text>

  <!-- Right face buttons -->
  <rect x="1116" y="10" width="262" height="66" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1130" y="36" class="label" fill="#15803d">B <tspan fill="#111827">· Camera mode</tspan></text>
  <text x="1130" y="60" class="label-note">Classic / Auto / First person</text>

  <!-- Right grip -->
  <rect x="1078" y="578" width="260" height="44" rx="12" fill="#ffffffdd" stroke="#d6dee8"/>
  <text x="1092" y="607" class="label" fill="#7e22ce">RG <tspan fill="#111827">· Behaviour action</tspan></text>

  <!-- Bottom panel -->
  <rect x="0" y="1080" width="1920" height="540" fill="#f4f6f9"/>
  <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="1136" class="title">Meta Quest 3 controller map</text>
  <text x="40" y="1162" class="subtitle">LBA2 Classic Community · OpenXR build · default bindings · Touch Plus controllers</text>

  <!-- Spells -->
  <rect x="40" y="1192" width="560" height="300" rx="18" fill="#ffffff" stroke="#d8dee8"/>
  <text x="70" y="1234" class="card-title">Spell chords</text>
  <text x="70" y="1258" class="label-note">Hold LT, then press a face button.</text>

  <circle cx="90" cy="1298" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="90" y="1304" text-anchor="middle" class="letter">X</text>
  <text x="118" y="1304" class="card-text">Penguin</text>
  <circle cx="250" cy="1298" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="250" y="1304" text-anchor="middle" class="letter">A</text>
  <text x="278" y="1304" class="card-text">Protection</text>

  <circle cx="90" cy="1348" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="90" y="1354" text-anchor="middle" class="letter">Y</text>
  <text x="118" y="1354" class="card-text">Jetpack</text>
  <circle cx="250" cy="1348" r="16" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="250" y="1354" text-anchor="middle" class="letter">B</text>
  <text x="278" y="1354" class="card-text">Lightning</text>

  <!-- Cheats -->
  <rect x="640" y="1192" width="440" height="300" rx="18" fill="#ffffff" stroke="#d8dee8"/>
  <text x="670" y="1234" class="card-title">Cheats</text>
  <text x="670" y="1258" class="label-note">Touch the right thumbrest, then press:</text>
  <circle cx="690" cy="1300" r="16" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="690" y="1306" text-anchor="middle" class="letter">X</text>
  <text x="718" y="1306" class="card-text">Full: health, magic, clover</text>
  <circle cx="690" cy="1350" r="16" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="690" y="1356" text-anchor="middle" class="letter">Y</text>
  <text x="718" y="1356" class="card-text">Gold: +50 kashes / zlitos</text>

  <!-- Menus and notes -->
  <rect x="1120" y="1192" width="760" height="300" rx="18" fill="#ffffff" stroke="#d8dee8"/>
  <text x="1150" y="1234" class="card-title">Menus, dialogue and first person</text>
  <text x="1150" y="1272" class="card-text"><tspan fill="#0e7490" font-weight="700">Menus</tspan>  L stick select · A confirm · B or Menu back</text>
  <text x="1150" y="1308" class="card-text"><tspan fill="#15803d" font-weight="700">Dialogue</tspan>  A skips the current line</text>
  <text x="1150" y="1344" class="card-text"><tspan fill="#b45309" font-weight="700">First person</tspan>  R stick X turns · RT arms and releases the magic ball</text>
  <text x="1150" y="1380" class="card-text"><tspan fill="#4338ca" font-weight="700">Interior</tspan>  L thumbrest + R stick up/down zooms</text>
  <text x="1150" y="1416" class="card-text"><tspan fill="#7e22ce" font-weight="700">Head tracking</tspan>  look around; body and hands follow</text>

  <text x="40" y="1568" class="footer">Lines connect each control to its action. Head tracking works with both controllers.</text>
</svg>

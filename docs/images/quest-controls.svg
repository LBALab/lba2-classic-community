<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1620" viewBox="0 0 1920 1620">
  <style>
    text { font-family: "DejaVu Sans", "Liberation Sans", sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 16px; fill: #475569; }
    .bar-title { font-size: 21px; font-weight: 700; fill: #111827; }
    .bar-note { font-size: 14px; fill: #475569; }
    .col-title { font-size: 18px; font-weight: 700; fill: #111827; letter-spacing: 1.4px; }
    .control { font-size: 18px; font-weight: 700; fill: #111827; }
    .action { font-size: 16px; fill: #1f2937; }
    .note { font-size: 14px; fill: #64748b; }
    .badge-num { font-size: 18px; font-weight: 700; fill: #111827; }
    .badge-num-sm { font-size: 15px; font-weight: 700; fill: #111827; }
    .letter { font-size: 18px; font-weight: 700; fill: #111827; }
  </style>

  <!-- Background photograph supplied for the controller map -->
  <image href="quest3-controllers.jpg" x="0" y="0" width="1920" height="1080"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1920" height="82" fill="#ffffffee"/>
  <line x1="0" y1="82" x2="1920" y2="82" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="40" class="title">Meta Quest 3 controller map</text>
  <text x="40" y="66" class="subtitle">LBA2 Classic Community · OpenXR build · default bindings</text>

  <g transform="translate(1488,41)">
    <rect x="-22" y="-14" width="44" height="28" rx="9" fill="none" stroke="#4338ca" stroke-width="2.5"/>
    <circle cx="-8" cy="0" r="5.5" fill="#4338ca" opacity="0.65"/>
    <circle cx="8" cy="0" r="5.5" fill="#4338ca" opacity="0.65"/>
    <path d="M -22 0 L -34 7 M 22 0 L 34 7" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="1534" y="36" class="bar-title">Head tracking</text>
  <text x="1534" y="59" class="bar-note">Look around · body and hands follow</text>

  <!-- Numbered badges on the controllers -->
  <g>
    <!-- left controller -->
    <circle cx="590" cy="150" r="18" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="590" y="156" text-anchor="middle" class="badge-num">1</text>

    <circle cx="495" cy="225" r="18" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="495" y="231" text-anchor="middle" class="badge-num">2</text>

    <circle cx="540" cy="115" r="18" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <text x="540" y="121" text-anchor="middle" class="badge-num">3</text>

    <circle cx="700" cy="520" r="18" fill="#ffffff" stroke="#7e22ce" stroke-width="2.5"/>
    <text x="700" y="526" text-anchor="middle" class="badge-num">4</text>

    <circle cx="635" cy="310" r="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <text x="635" y="316" text-anchor="middle" class="badge-num">5</text>

    <circle cx="715" cy="170" r="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <text x="715" y="176" text-anchor="middle" class="badge-num">6</text>

    <circle cx="425" cy="285" r="18" fill="#ffffff" stroke="#7e22ce" stroke-width="2.5"/>
    <text x="425" y="291" text-anchor="middle" class="badge-num">7</text>

    <circle cx="540" cy="245" r="18" fill="#ffffff" stroke="#4338ca" stroke-width="2.5"/>
    <text x="540" y="251" text-anchor="middle" class="badge-num">8</text>

    <!-- right controller -->
    <circle cx="1410" cy="150" r="18" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="1410" y="156" text-anchor="middle" class="badge-num">9</text>

    <circle cx="1300" cy="225" r="18" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="1300" y="231" text-anchor="middle" class="badge-num">10</text>

    <circle cx="1360" cy="115" r="18" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <text x="1360" y="121" text-anchor="middle" class="badge-num">11</text>

    <circle cx="1180" cy="520" r="18" fill="#ffffff" stroke="#7e22ce" stroke-width="2.5"/>
    <text x="1180" y="526" text-anchor="middle" class="badge-num">12</text>

    <circle cx="1325" cy="310" r="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <text x="1325" y="316" text-anchor="middle" class="badge-num">13</text>

    <circle cx="1175" cy="170" r="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <text x="1175" y="176" text-anchor="middle" class="badge-num">14</text>

    <circle cx="1360" cy="245" r="18" fill="#ffffff" stroke="#4338ca" stroke-width="2.5"/>
    <text x="1360" y="251" text-anchor="middle" class="badge-num">15</text>
  </g>

  <!-- Legend panel -->
  <rect x="0" y="1080" width="1920" height="540" fill="#f4f6f9"/>
  <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Left controller legend -->
  <text x="40" y="1130" class="col-title">LEFT CONTROLLER</text>

  <g>
    <circle cx="58" cy="1168" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="58" y="1173" text-anchor="middle" class="badge-num-sm">1</text>
    <text x="84" y="1173" class="control">L stick</text>
    <text x="84" y="1195" class="action">Move</text>

    <circle cx="58" cy="1218" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="58" y="1223" text-anchor="middle" class="badge-num-sm">2</text>
    <text x="84" y="1223" class="control">L stick click</text>
    <text x="84" y="1245" class="action">Dodge</text>

    <circle cx="58" cy="1268" r="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="58" y="1273" text-anchor="middle" class="badge-num-sm">3</text>
    <text x="84" y="1273" class="control">LT</text>
    <text x="84" y="1295" class="action">Backward</text>
    <text x="84" y="1315" class="note">Spell modifier when held with a face button</text>

    <circle cx="58" cy="1338" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <text x="58" y="1343" text-anchor="middle" class="badge-num-sm">4</text>
    <text x="84" y="1343" class="control">LG</text>
    <text x="84" y="1365" class="action">Behaviour menu</text>
    <text x="84" y="1385" class="note">Hold to keep open</text>

    <circle cx="58" cy="1408" r="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="58" y="1413" text-anchor="middle" class="badge-num-sm">5</text>
    <text x="84" y="1413" class="control">X</text>
    <text x="84" y="1435" class="action">Inventory</text>

    <circle cx="58" cy="1458" r="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="58" y="1463" text-anchor="middle" class="badge-num-sm">6</text>
    <text x="84" y="1463" class="control">Y</text>
    <text x="84" y="1485" class="action">Holomap</text>

    <circle cx="58" cy="1508" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <text x="58" y="1513" text-anchor="middle" class="badge-num-sm">7</text>
    <text x="84" y="1513" class="control">Menu</text>
    <text x="84" y="1535" class="action">In-game menu</text>
  </g>

  <!-- Right controller legend -->
  <text x="700" y="1130" class="col-title">RIGHT CONTROLLER</text>

  <g>
    <circle cx="718" cy="1168" r="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="718" y="1173" text-anchor="middle" class="badge-num-sm">9</text>
    <text x="744" y="1173" class="control">R stick</text>
    <text x="744" y="1195" class="action">Camera orbit / turn</text>

    <circle cx="718" cy="1218" r="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="718" y="1223" text-anchor="middle" class="badge-num-sm">10</text>
    <text x="744" y="1223" class="control">R stick click</text>
    <text x="744" y="1245" class="action">Recentre camera</text>

    <circle cx="718" cy="1268" r="14" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="718" y="1273" text-anchor="middle" class="badge-num-sm">11</text>
    <text x="744" y="1273" class="control">RT</text>
    <text x="744" y="1295" class="action">Throw / use weapon</text>
    <text x="744" y="1315" class="note">First person: hold to arm, release to throw</text>

    <circle cx="718" cy="1338" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <text x="718" y="1343" text-anchor="middle" class="badge-num-sm">12</text>
    <text x="744" y="1343" class="control">RG</text>
    <text x="744" y="1365" class="action">Behaviour action</text>

    <circle cx="718" cy="1390" r="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="718" y="1395" text-anchor="middle" class="badge-num-sm">13</text>
    <text x="744" y="1395" class="control">A</text>
    <text x="744" y="1417" class="action">Talk / search / use</text>

    <circle cx="718" cy="1442" r="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="718" y="1447" text-anchor="middle" class="badge-num-sm">14</text>
    <text x="744" y="1447" class="control">B</text>
    <text x="744" y="1469" class="action">Camera mode</text>
    <text x="744" y="1489" class="note">Classic / Auto / First person</text>

    <circle cx="718" cy="1512" r="14" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
    <text x="718" y="1517" text-anchor="middle" class="badge-num-sm">15</text>
    <text x="744" y="1517" class="control">R thumbrest</text>
    <text x="744" y="1538" class="action">Cheat chord (touch + X / Y)</text>
  </g>

  <!-- Third column: spells, cheats, notes -->
  <line x1="1360" y1="1110" x2="1360" y2="1540" stroke="#d8dee8" stroke-width="2"/>
  <text x="1392" y="1130" class="col-title">SPELLS, CHEATS &amp; NOTES</text>

  <text x="1392" y="1170" class="control">Spell chords</text>
  <text x="1392" y="1192" class="note">Hold LT, then press:</text>

  <circle cx="1408" cy="1226" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1408" y="1232" text-anchor="middle" class="letter">X</text>
  <text x="1434" y="1232" class="action">Penguin</text>
  <circle cx="1530" cy="1226" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1530" y="1232" text-anchor="middle" class="letter">A</text>
  <text x="1556" y="1232" class="action">Protection</text>

  <circle cx="1408" cy="1264" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1408" y="1270" text-anchor="middle" class="letter">Y</text>
  <text x="1434" y="1270" class="action">Jetpack</text>
  <circle cx="1530" cy="1264" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1530" y="1270" text-anchor="middle" class="letter">B</text>
  <text x="1556" y="1270" class="action">Lightning</text>

  <text x="1392" y="1312" class="control">Cheats</text>
  <text x="1392" y="1334" class="note">Touch the right thumbrest, then press:</text>
  <circle cx="1408" cy="1366" r="15" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1408" y="1372" text-anchor="middle" class="letter">X</text>
  <text x="1434" y="1372" class="action">Full: health, magic and clover</text>
  <circle cx="1408" cy="1404" r="15" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1408" y="1410" text-anchor="middle" class="letter">Y</text>
  <text x="1434" y="1410" class="action">Gold: +50 kashes or zlitos</text>

  <text x="1392" y="1452" class="control">Menus &amp; dialogue</text>
  <text x="1392" y="1474" class="action">L stick select · A confirm · B or Menu back</text>
  <text x="1392" y="1496" class="action">A skips the current dialogue line</text>
  <text x="1392" y="1518" class="note">First person: R stick X turns · RT arms and releases</text>

  <text x="40" y="1592" class="note">Numbers match the badges on the controllers. Head tracking works with both controllers.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The rings and the core</title>
<desc id="d">Four nested rings. At the centre the inner core, the game: rules, saves, formats. Around it the outer core, the platform. Then Modern, then Experimental. Auto camera, HD and LBA1 move inward. Platforms are a separate axis: every platform runs the same core.</desc>
<style>
.bg{fill:#ffffff}.exp{fill:#f1f4f9}.mod{fill:#dfe7f3}.out{fill:#bccde6}.inn{fill:#2f5597}
.ring{stroke:#8a9bb5;stroke-width:1}
.t{fill:#1f2328}.s{fill:#57606a}.ti{fill:#ffffff}.si{fill:#d6e2f5}
.div{stroke:#8a9bb5;stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:#1f2328;stroke-width:1.5;fill:none}.ah{fill:#1f2328}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.exp{fill:#151c27}.mod{fill:#1c2839}.out{fill:#2a3f62}.inn{fill:#7fa3e0}
.ring{stroke:#4b5d7a}
.t{fill:#e6edf3}.s{fill:#9da7b3}.ti{fill:#0d1117}.si{fill:#1c2a44}
.div{stroke:#4b5d7a}.arr{stroke:#e6edf3}.ah{fill:#e6edf3}}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="900" height="750"/>
<circle class="exp ring" cx="450" cy="360" r="295"/>
<circle class="mod ring" cx="450" cy="360" r="225"/>
<circle class="out ring" cx="450" cy="360" r="155"/>
<circle class="inn ring" cx="450" cy="360" r="80"/>
<rect class="exp" x="392" y="77" width="117" height="22" rx="4"/>
<text class="t" x="450" y="91" text-anchor="middle" font-size="14" font-weight="700">Experimental</text>
<rect class="mod" x="417" y="147" width="66" height="22" rx="4"/>
<text class="t" x="450" y="161" text-anchor="middle" font-size="14" font-weight="700">Modern</text>
<text class="t" x="450" y="229" text-anchor="middle" font-size="14" font-weight="700">Outer core: the platform</text>
<text class="s" x="450" y="247" text-anchor="middle" font-size="12">PAL · console · recording</text>
<text class="s" x="450" y="262" text-anchor="middle" font-size="12">settings · test harness</text>
<text class="ti" x="450" y="354" text-anchor="middle" font-size="15" font-weight="700">Inner core</text>
<text class="si" x="450" y="372" text-anchor="middle" font-size="12">the game</text>
<text class="si" x="450" y="388" text-anchor="middle" font-size="12">rules · saves · formats</text>
<text class="t" x="233" y="218" text-anchor="middle" font-size="13" font-weight="600">Auto camera</text>
<line class="arr" x1="248" y1="224" x2="279" y2="245" marker-end="url(#h)"/>
<text class="t" x="192" y="320" text-anchor="middle" font-size="13" font-weight="600">HD</text>
<line class="arr" x1="210" y1="318" x2="247" y2="324" marker-end="url(#h)"/>
<text class="t" x="213" y="476" text-anchor="middle" font-size="13" font-weight="600">LBA1</text>
<line class="arr" x1="229" y1="463" x2="263" y2="447" marker-end="url(#h)"/>
<text class="s" x="450" y="690" text-anchor="middle" font-size="13">Dependencies point inward. Things move inward on evidence, and care rises toward the centre.</text>
<text class="s" x="450" y="712" text-anchor="middle" font-size="13">Original, the 1997 game, is not a ring: it is the reference the inner core is measured against.</text>
<text class="s" x="450" y="734" text-anchor="middle" font-size="13">Platforms are a separate axis: every platform runs the same core.</text>
</svg>
